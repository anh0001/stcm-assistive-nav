# Round-2 probe extras for S3 outdoor classes NOT covered in
# scripts/probe/outdoor_extra_aliases.yaml (round 1 covered: basketball,
# umbrella, electric_wheelchair, electric_scooter, prohibition_sign,
# pair_of_ramps, trailer). Adds: cardboard_box, chair,
# electric_utility_vehicle, portable_power_station, rectangular_table,
# traffic_cone, trolley.

