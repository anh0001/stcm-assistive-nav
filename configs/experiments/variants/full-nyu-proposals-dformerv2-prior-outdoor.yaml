# Outdoor S3 variant: same model + fusion as full-nyu-proposals-dformerv2-prior.
# Points at renamed yaml in nyu-grounded-rgbd (dformerv2_b_pretrained_nyu40 ->
# stcm_trans_v2_b_pretrained_nyu40). Architecture (DFormerv2-Base, NYU40 weights)
# unchanged; only path renamed upstream. Scenario block injects outdoor labels +
# prompt bank; this overlay only carries prior config.
offline_sequential: true
use_sim_time: true
run_updater: false
place_gng_enabled: true
gng_enabled: true
use_projected_lidar: true
use_depth_anything_fallback: false

perception_backend: nyu_grounded_rgbd
nyu_grounded_repo_path: /home/anhar/codes/nyu-grounded-rgbd
nyu_prompt_bank_path: stcm/config/meeting_nyu_grounded_prompts.yaml
nyu_gdino_model_id: IDEA-Research/grounding-dino-base
nyu_sam_backend: mobilesam
nyu_sam_model_type: vit_t
label_rerank_enabled: true
label_rerank_model: openai/clip-vit-base-patch32
label_margin_min: 0.08

semantic_prior_backend: dformerv2
semantic_prior_experiment_config: configs/experiment/stcm_trans_v2_b_pretrained_nyu40.yaml
semantic_prior_fusion_enabled: true
semantic_prior_fallback_enabled: true
semantic_prior_agreement_boost: 0.35
semantic_prior_disagreement_penalty: 0.45
semantic_prior_min_agreement: 0.08
semantic_prior_fallback_min_area_px: 500
semantic_prior_fallback_max_area_frac: 0.20
semantic_prior_fallback_max_per_label: 2
semantic_prior_fallback_score: 0.35

box_threshold: 0.3
text_threshold: 0.3
gng_min_observations_to_commit: 3
instance_label_voting_enabled: true
cross_label_merge_distance_m: 0.6
cross_label_merge_min_cosine: 0.25
instance_label_switch_margin: 0.15
instance_label_switch_min_observations: 2

target_labels:
  - "meeting table set"
  - "chair"
  - "bottle"
  - "cup"
  - "water fountain"
  - "cardboard box"
  - "emergency exit sign"
  - "trash bin"
  - "bench"
  - "door"

target_label_thresholds:
  - 1.6
  - 0.6
  - 0.3
  - 0.5
  - 0.5
  - 1.0
  - 0.3
  - 0.25
  - 0.8
  - 1.0

per_label_geometry_priors:
  emergency_exit_sign:
    min_z: 1.2
    max_mask_area_frac: 0.03
    hard_min_z: 1.6
    hard_max_mask_area_frac: 0.02
    penalty_factor: 0.2
  trash_bin:
    min_z: 0.0
    max_z: 0.9
    hard_max_z: 0.8
    min_mask_area_frac: 0.002
    max_mask_area_frac: 0.08
    penalty_factor: 0.35
  meeting_table_set:
    min_z: 0.45
    max_z: 1.1
    min_mask_area_frac: 0.015
    hard_min_mask_area_frac: 0.02
    penalty_factor: 0.35
  chair:
    min_z: 0.2
    max_z: 1.2
    max_mask_area_frac: 0.06
    penalty_factor: 0.35
  bottle:
    min_z: 0.0
    max_z: 0.3
    max_mask_area_frac: 0.02
    penalty_factor: 0.2
  cup:
    min_z: 0.0
    max_z: 0.3
    max_mask_area_frac: 0.025
    penalty_factor: 0.2
