# Real-proposal variant: same backbone as full-nyu-proposals, but uses scene-specific
# real-prompt banks (single chunk, GT class names + naive plural + stripped-modifier
# aliases only — no NYU40 alias engineering, no per-class threshold tuning). CLIP
# rerank kept ON for fair comparison vs full-nyu-proposals. Bind to scenario via
# *_real scenario entries which inject the matching {scene}_real_prompts.yaml bank.
offline_sequential: true
use_sim_time: true
run_updater: false
place_gng_enabled: true
gng_enabled: true
use_projected_lidar: true
use_depth_anything_fallback: false

perception_backend: nyu_grounded_rgbd
nyu_grounded_repo_path: /home/anhar/codes/nyu-grounded-rgbd
nyu_prompt_bank_path: stcm/config/meeting_real_prompts.yaml
nyu_gdino_model_id: IDEA-Research/grounding-dino-base
nyu_sam_backend: mobilesam
nyu_sam_model_type: vit_t
label_rerank_enabled: true
label_rerank_model: openai/clip-vit-base-patch32
label_margin_min: 0.08

box_threshold: 0.3
text_threshold: 0.3
gng_min_observations_to_commit: 3
instance_label_voting_enabled: true
cross_label_merge_distance_m: 0.6
cross_label_merge_min_cosine: 0.25
instance_label_switch_margin: 0.15
instance_label_switch_min_observations: 2

# S1 meeting target_labels (S2/S3 scenarios override via config_overrides).
# Without this, base config defaults leak through and mismatch GT (e.g. "trash
# bins" plural, "elevator sliding door"), suppressing all S1 class matching.
target_labels:
  - "meeting table set"
  - "chair"
  - "bottle"
  - "cup"
  - "water fountain"
  - "cardboard box"
  - "emergency exit sign"
  - "trash bin"
  - "bench"
  - "door"

target_label_thresholds:
  - 1.6  # meeting table set
  - 0.6  # chair
  - 0.3  # bottle
  - 0.5  # cup
  - 0.5  # water fountain
  - 1.0  # cardboard box
  - 0.3  # emergency exit sign
  - 0.25 # trash bin
  - 0.8  # bench
  - 1.0  # door
