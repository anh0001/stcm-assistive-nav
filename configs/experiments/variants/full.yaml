offline_sequential: true
use_sim_time: true
run_updater: false
place_gng_enabled: true
gng_enabled: true
use_projected_lidar: true
use_depth_anything_fallback: false

box_threshold: 0.45
text_threshold: 0.45
gng_min_observations_to_commit: 2

text_prompt: >-
  meeting table set . large meeting table . conference table . metallic desk . tables .
  armless chair . dark thermos bottle . white drinking cup .
  metallic water fountain . brown cardboard box . green emergency exit sign .
  indoor trash bin . metal bench . dark door surface .
  upright vacuum cleaner . potted plant in plastic pot . pair of indoor shoes .
  small electric vehicle . portable power bank battery .

target_labels:
  - "meeting table set"
  - "table"
  - "desk"
  - "chair"
  - "bottle"
  - "cup"
  - "water fountain"
  - "cardboard box"
  - "emergency exit sign"
  - "trash bin"
  - "bench"
  - "door"
  - "vacuum cleaner"
  - "plant pot"
  - "shoes"
  - "electric vehicle"
  - "large power bank"

target_label_thresholds:
  - 1.6  # meeting table set
  - 1.6  # table
  - 1.6  # desk
  - 0.6  # chair
  - 0.3  # bottle
  - 0.5  # cup
  - 0.5  # water fountain
  - 1.0  # cardboard box
  - 0.3  # emergency exit sign
  - 0.25 # trash bin
  - 0.8  # bench
  - 1.5  # door
  - 0.8  # vacuum cleaner
  - 0.5  # plant pot
  - 0.3  # shoes
  - 1.0  # electric vehicle
  - 0.5  # large power bank
