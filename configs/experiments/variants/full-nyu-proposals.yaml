offline_sequential: true
use_sim_time: true
run_updater: false
place_gng_enabled: true
gng_enabled: true
use_projected_lidar: true
use_depth_anything_fallback: false

perception_backend: nyu_grounded_rgbd
nyu_grounded_repo_path: /home/anhar/codes/nyu-grounded-rgbd
nyu_prompt_bank_path: stcm/config/meeting_nyu_grounded_prompts.yaml
nyu_gdino_model_id: IDEA-Research/grounding-dino-base
nyu_sam_backend: mobilesam
nyu_sam_model_type: vit_t

box_threshold: 0.3
text_threshold: 0.3
gng_min_observations_to_commit: 3

target_labels:
  - "meeting table set"
  - "chair"
  - "bottle"
  - "cup"
  - "water fountain"
  - "cardboard box"
  - "emergency exit sign"
  - "trash bin"
  - "bench"
  - "door"

target_label_thresholds:
  - 1.6  # meeting table set
  - 0.6  # chair
  - 0.3  # bottle
  - 0.5  # cup
  - 0.5  # water fountain
  - 1.0  # cardboard box
  - 0.3  # emergency exit sign
  - 0.25 # trash bin
  - 0.8  # bench
  - 1.0  # door
