# Semantic mapping launch parameters. Adjust these values as needed before running
# `ros2 launch stcm semantic_mapping.launch.py`.

# ============================================================================
# OFFLINE ROSBAG SEQUENTIAL MODE
# ============================================================================
# Enable deterministic single-thread processing from a rosbag2 file.
offline_sequential: true
# Path to the rosbag2 directory (required when offline_sequential is true).
rosbag_path: "/media/STREAM/ranger_recording_20251215_163827_uncompressed"
# Storage plugin for rosbag2 ("sqlite3" default, use "mcap" if applicable).
rosbag_storage_id: "sqlite3"

# ============================================================================
# CAMERA TOPICS - Adjust to match your RGB-D camera driver
# Find your topics: ros2 topic list | grep image
# ============================================================================
rgb_topic: "/camera/image_raw"
depth_topic: "/camera/aligned_depth_to_color/image_raw"
camera_info_topic: "/camera/camera_info"

# ============================================================================
# TF FRAMES - Adjust to match your robot's transform tree
# Verify: ros2 run tf2_tools view_frames
# ============================================================================
# `camera_frame` also overrides the frame_id reported by `rgb_topic` when publishing debug images.
camera_frame: "camera_color_optical_frame"
base_frame: "base_footprint"
world_frame: "map"

# ============================================================================
# OPTIONAL CAMERA-LIDAR FUSION
# Enable to use `/lidar_points_projected` instead of `depth_topic`.
# The projected cloud must include u/v pixel fields plus XYZ in the lidar frame; SAM masks filter those points.
# `projected_lidar_frame` overrides the PointCloud2 header frame (leave blank to use header).
# ============================================================================
use_projected_lidar: true
projected_lidar_topic: "/lidar_points_projected"
projected_lidar_frame: "lidar_link"
# Seconds to wait for projected lidar frames before falling back to the depth topic.
# This should be 2-3x your RGB camera period to allow for sync delays.
projected_lidar_timeout_sec: 3.0
# Maximum time difference (in seconds) for synchronizing RGB and projected LiDAR messages.
# In offline sequential mode, this is the pairing window for RGB/depth or RGB/LiDAR.
# Increase this if RGB camera has irregular frame rate.
# Your RGB camera varies by ~760ms, so use 2.0s to ensure sync success.
synchronizer_slop_sec: 2.0

# ============================================================================
# OBJECT DETECTION - What to detect and track
# ============================================================================
# Space-separated list; end each object with " ." (space + period)
text_prompt: >-
  tables . armless chairs . dark thermos bottle . white drinking cups .
  metallic desk . metallic water fountain . brown cardboard box .
  green emergency exit sign . five indoor trash bins aligned against a wall .
  dark elevator sliding door, door surface only .

# List of object classes matching the text_prompt
target_labels:
  - "table"
  - "chair"
  - "bottle"
  - "cup"
  - "desk"
  - "water fountain"
  - "cardboard box"
  - "emergency exit sign"
  - "trash bins"
  - "elevator sliding door"

# Per-class merge radius in meters (larger values for bigger objects)
target_label_thresholds:
  - 2.0  # table
  - 0.6  # chair
  - 0.3  # bottle
  - 0.5  # cup
  - 2.0  # desk
  - 0.5  # water fountain
  - 1.0  # cardboard box
  - 0.3  # emergency exit sign
  - 2.0  # trash bins
  - 1.0  # elevator sliding door

# Detection confidence thresholds (0.0-1.0)
box_threshold: 0.55
text_threshold: 0.55

# ============================================================================
# DETECTION FILTERING - Additional pruning before segmentation
# ============================================================================
# Skip frame if any detection confidence exceeds this (0.0-1.0, default 1.0 = disabled)
filter_conf_bound: 1.0

# Remove detections below this image-space y position (normalized).
# 0.0 = top of image, 1.0 = bottom of image (not 3D/world z).
filter_y_val: 0.95

# Reject boxes larger than this fraction of image width/height (0.0-1.0)
filter_percent_width: 0.9
filter_percent_height: 0.9

# Reject boxes smaller than this fraction of total image area (0.0-1.0)
filter_percent_area: 0.005

# Enable/disable all detection filters
filter_enabled: true

# ============================================================================
# SPATIAL RELATIONSHIPS - Edge creation between objects
# ============================================================================
# Maximum distance in meters to create edges between nodes (spatial relationships)
# Objects within this distance will be connected in the graph
edge_distance_threshold: 3.0

# ============================================================================
# OUTPUT AND TIMING
# ============================================================================
# Where to save the semantic graph JSON file
graph_output_path: "output/semantic_graph.json"

# Set `true` for bag playback or Gazebo, `false` for live robot
use_sim_time: true

# Clear the TF buffer when /clock jumps backward (common with rosbag loop/restart)
reset_tf_on_time_jump: true

# Enable updater node to continuously update an existing graph
run_updater: false

# ============================================================================
# MODEL CHECKPOINTS
# ============================================================================

# Optional override for the GroundingDINO checkpoint (.pth). Leave blank to
# download via HuggingFace caching, or point to a file such as
# `./models/gdino/groundingdino_swint_ogc.pth`.
groundingdino_checkpoint: "/home/anhar/codes/stcm-assistive-nav/models/gdino/groundingdino_swint_ogc.pth"

# Optional MobileSAM checkpoint. Defaults to searching under `./models`, but you
# can hardcode a file like `./models/mobilesam/vit_t.pth`.
mobilesam_checkpoint: "/home/anhar/codes/stcm-assistive-nav/models/mobilesam/vit_t.pth"

# Optional Depth-Anything HuggingFace repo ID or a local directory containing HF
# model/config files. If a .pth file is provided, the fallback uses the default
# HF model instead.
depth_anything_checkpoint: "LiheYoung/depth-anything-small-hf"
# Scale (meters) used to map Depth Anything relative depth when no metric depth
# is available for calibration.
depth_anything_max_depth: 5.0
