# Semantic Topological Cognitive Map launch parameters.
# Adjust these values as needed before running
# `ros2 launch stcm semantic_mapping.launch.py`.

# ============================================================================
# OFFLINE ROSBAG SEQUENTIAL MODE
# ============================================================================
# Enable deterministic single-thread processing from a rosbag2 file.
offline_sequential: true
# Path to the rosbag2 directory (required when offline_sequential is true).
rosbag_path: "/media/dl-box/STREAM1/robotics_living_lab_20260417_171737"
# Storage plugin for rosbag2 ("sqlite3" default, use "mcap" if applicable).
rosbag_storage_id: "mcap"
# Process every Nth RGB frame from the rosbag (1 = every frame).
offline_frame_stride: 5

# ============================================================================
# CAMERA TOPICS - Adjust to match your RGB-D camera driver
# Find your topics: ros2 topic list | grep image
# ============================================================================
rgb_topic: "/camera/image_raw"
# if the use_projected_lidar option is false, depth_topic will be used
depth_topic: "/camera/aligned_depth_to_color/image_raw"
camera_info_topic: "/camera/camera_info"

# ============================================================================
# TF FRAMES - Adjust to match your robot's transform tree
# Verify: ros2 run tf2_tools view_frames
# ============================================================================
# `camera_frame` also overrides the frame_id reported by `rgb_topic` when publishing debug images.
camera_frame: "camera_color_optical_frame"
base_frame: "base_footprint"
world_frame: "map"

# ============================================================================
# OPTIONAL CAMERA-LIDAR FUSION
# Enable to use `/lidar_points_projected` instead of `depth_topic`.
# The projected cloud must include u/v pixel fields plus XYZ in the lidar frame; SAM masks filter those points.
# `projected_lidar_frame` overrides the PointCloud2 header frame (leave blank to use header).
# ============================================================================
use_projected_lidar: true
# When true, skip RGB-D + Depth-Anything fallbacks entirely and reject any
# detection whose projected-lidar pose computation fails (no cloud, mask
# uncovered, etc.). Useful outdoors where RGB-D depth is noisy past 4-6m.
require_projected_lidar: false
# Pose estimator: "mean" (legacy mean of mask-internal points) or
# "densest_voxel" (densest voxel; robust to mask noise on ground/background;
# recommended outdoors).
pose_estimator_mode: "mean"
pose_voxel_size_m: 0.15
projected_lidar_topic: "/lidar_points_projected"
projected_lidar_frame: "lidar_link"
# Seconds to wait for projected lidar frames before falling back to the depth topic.
# This should be 2-3x your RGB camera period to allow for sync delays.
projected_lidar_timeout_sec: 3.0
# Maximum time difference (in seconds) for synchronizing RGB and projected LiDAR messages.
# In offline sequential mode, this is the pairing window for RGB/depth or RGB/LiDAR.
# Increase this if RGB camera has irregular frame rate.
# Your RGB camera varies by ~760ms, so use 2.0s to ensure sync success.
synchronizer_slop_sec: 2.0

# ============================================================================
# TOPOLOGICAL PLACE GRAPH - GNG place discovery
# ============================================================================
# Enable the STCM topological GNG place-graph module.
place_gng_enabled: true
# Pose insertion threshold D_new (meters); only insert samples when farther than this.
# This does not enforce node spacing; place_gng_lambda controls node growth cadence.
place_gng_distance_threshold: 0.5
# Winner learning rate epsilon_b.
place_gng_eps_w: 0.1
# Neighbor learning rate epsilon_n.
place_gng_eps_n: 0.01
# Edge age threshold a_max before removal.
place_gng_max_edge_age: 50
# Max number of place nodes for i-GNG (0 = unlimited).
place_gng_max_nodes: 0
# Add a new i-GNG node every N inserted samples (lower = denser graph).
place_gng_lambda: 1
# Error decay rate for i-GNG.
place_gng_alpha: 0.95
# Global error reduction for i-GNG.
place_gng_beta: 0.9995
# Semantic fusion rate alpha for place labels.
place_gng_semantic_alpha: 0.1
# Aggregate detection confidences per class: "max" or "sum".
place_gng_semantic_aggregation: "max"
# Create/refresh edges between winner and 2nd nearest node.
place_gng_use_second_best_edge: true
# Create/refresh edges on winner transitions (i_{t-1} -> i*).
place_gng_use_transition_edges: true
# Apply semantic updates even when no detections are present.
place_gng_update_when_empty: false

# ============================================================================
# OBJECT DETECTION - What to detect and track
# ============================================================================
# Space-separated list; end each object with " ." (space + period)
text_prompt: >-
  tables . armless chairs . dark thermos bottle . white drinking cups .
  metallic desk . metallic water fountain . brown cardboard box .
  green emergency exit sign . five indoor trash bins aligned against a wall .
  dark elevator sliding door, door surface only .

# List of object classes matching the text_prompt
target_labels:
  - "table"
  - "chair"
  - "bottle"
  - "cup"
  - "desk"
  - "water fountain"
  - "cardboard box"
  - "emergency exit sign"
  - "trash bins"
  - "elevator sliding door"

# Per-class merge radius in meters (larger values for bigger objects)
target_label_thresholds:
  - 2.0  # table
  - 0.6  # chair
  - 0.3  # bottle
  - 0.5  # cup
  - 2.0  # desk
  - 0.5  # water fountain
  - 1.0  # cardboard box
  - 0.3  # emergency exit sign
  - 2.0  # trash bins
  - 1.5  # elevator sliding door

# Detection confidence thresholds (0.0-1.0)
box_threshold: 0.55
text_threshold: 0.55

# Optional alternative proposal backend.
# "legacy" = STCM's original GroundingDINO + MobileSAM path.
# "nyu_grounded_rgbd" = reuse the detector/SAM proposal stage from the
# external nyu-grounded-rgbd repo while keeping STCM graph building unchanged.
perception_backend: "legacy"
nyu_grounded_repo_path: "/home/anhar/codes/nyu-grounded-rgbd"
nyu_prompt_bank_path: "stcm/config/meeting_nyu_grounded_prompts.yaml"
nyu_gdino_model_id: "IDEA-Research/grounding-dino-base"
nyu_sam_backend: "mobilesam"
nyu_sam_model_type: "vit_t"
label_rerank_enabled: false
label_rerank_model: "openai/clip-vit-base-patch32"
label_margin_min: 0.1

# Optional frozen supervised RGB-D semantic prior.
# "none" keeps the original detector/SAM path unchanged.
# "dformerv2" and "esanet" reuse the supervised NYUv2 backends from
# /home/anhar/codes/nyu-grounded-rgbd as conservative proposal priors.
semantic_prior_backend: "none"
semantic_prior_checkpoint: ""
semantic_prior_experiment_config: ""
semantic_prior_fusion_enabled: true
semantic_prior_agreement_boost: 0.35
semantic_prior_disagreement_penalty: 0.45
semantic_prior_min_agreement: 0.08
semantic_prior_fallback_enabled: true
semantic_prior_fallback_min_area_px: 400
semantic_prior_fallback_max_area_frac: 0.25
semantic_prior_fallback_max_per_label: 3
semantic_prior_fallback_score: 0.35

# ============================================================================
# DETECTION FILTERING - Additional pruning before segmentation
# ============================================================================
# Skip frame if any detection confidence exceeds this (0.0-1.0, default 1.0 = disabled)
filter_conf_bound: 1.0

# Remove detections below this image-space y position (normalized).
# 0.0 = top of image, 1.0 = bottom of image (not 3D/world z).
filter_y_val: 0.95

# Reject boxes larger than this fraction of image width/height (0.0-1.0)
filter_percent_width: 0.9
filter_percent_height: 0.9

# Reject boxes smaller than this fraction of total image area (0.0-1.0)
filter_percent_area: 0.005

# Enable/disable all detection filters
filter_enabled: true

# ============================================================================
# INSTANCE MANAGEMENT - i-GNG clustering for filtering and stable instance IDs
# ============================================================================
# Enable per-label Growing Neural Gas clustering for stable instance IDs.
gng_enabled: true
# Maintain a separate GNG model per label (recommended).
gng_per_label: true
# GNG configuration values.
gng_max_nodes: 100       # Max instances to track per label
gng_lambda: 10           # Add new node every N observations (reduced from 200 to prevent pause deadlocks)
gng_max_age: 200         # Remove edges after N steps without use
gng_eps_w: 0.05          # Winner node learning rate (how fast instances move)
gng_eps_n: 0.0006        # Neighbor learning rate (slower than winner)
gng_alpha: 0.95          # Error decay rate (close to 1.0 = retain longer)
gng_beta: 0.9995         # Global error reduction per insertion step
# Require at least N observations before committing a graph node.
gng_min_observations_to_commit: 3
# Merge/associate components within this distance (meters).
gng_cluster_merge_distance: 0.5
# Ignore samples farther than this from existing instances (meters, 0 disables).
gng_outlier_gate_meters: 0.0
# Reject detections whose 3D pose is farther than this (meters) from the robot
# base xy at observation time. 0 disables. Useful for outdoor scenes where
# horizon/sky depth aliasing yields phantom detections beyond the meaningful
# sensor range.
max_observation_range_m: 0.0
instance_label_voting_enabled: false
cross_label_merge_distance_m: 0.5
cross_label_merge_min_cosine: 0.25
instance_label_switch_margin: 0.15
instance_label_switch_min_observations: 2

# ============================================================================
# SPATIAL RELATIONSHIPS - Edge creation between objects
# ============================================================================
# Maximum distance in meters to create edges between nodes (spatial relationships)
# Objects within this distance will be connected in the graph
edge_distance_threshold: 0.0

# ============================================================================
# OUTPUT AND TIMING
# ============================================================================
# Where to save the STCM JSON file (semantic + place graphs)
graph_output_path: "output/stcm.json"

# Set `true` for bag playback or Gazebo, `false` for live robot
use_sim_time: true

# Clear the TF buffer when /clock jumps backward (common with rosbag loop/restart)
reset_tf_on_time_jump: true

# Enable updater node to continuously update an existing graph
run_updater: false

# ============================================================================
# MODEL CHECKPOINTS
# ============================================================================

# Optional override for the GroundingDINO checkpoint (.pth). Leave blank to
# download via HuggingFace caching, or point to a file such as
# `./models/gdino/groundingdino_swint_ogc.pth`.
groundingdino_checkpoint: "/home/anhar/codes/stcm-assistive-nav/models/gdino/groundingdino_swint_ogc.pth"

# Optional MobileSAM checkpoint. Defaults to searching under `./models`, but you
# can hardcode a file like `./models/mobilesam/vit_t.pth`.
mobilesam_checkpoint: "/home/anhar/codes/stcm-assistive-nav/models/mobilesam/vit_t.pth"

# Optional Depth-Anything HuggingFace repo ID or a local directory containing HF
# model/config files. If a .pth file is provided, the fallback uses the default
# HF model instead.
depth_anything_checkpoint: "LiheYoung/depth-anything-small-hf"
# Allow Depth-Anything fallback when projected LiDAR/depth is unavailable.
use_depth_anything_fallback: false
# Scale (meters) used to map Depth Anything relative depth when no metric depth
# is available for calibration.
depth_anything_max_depth: 5.0
